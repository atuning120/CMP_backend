version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: cmp_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cmp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cmp_pass}
      POSTGRES_DB: ${DB_NAME:-cmp_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cmp_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend se ejecuta en modo local de desarrollo, pero si queremos Dockerizarlo:
  # backend:
  #   build: .
  #   ports:
  #     - "${PORT:-3000}:3000"
  #   depends_on:
  #     - postgres
  #     - redis
  #   env_file:
  #     - .env

volumes:
  postgres_data:
  redis_data:
