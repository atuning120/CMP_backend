# Verifica cada PR hacia main: el Backend debe instalar, pasar lint, typecheck, tests, compilar
# y generar la imagen Docker que luego se despliega en Azure Container Apps.
name: CI Backend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la verificación anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Misma versión de pnpm y Node que el Dockerfile
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Imagen Docker
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo se construye para validar el Dockerfile; no se publica en ACR
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
